<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>wAFF's Strafe Sync Analyzer</title>
    <style>
        :root {
            --rgb-speed: 4s;
            --border-width: 6px;
        }

        html::before {
            content: '';
            position: fixed;
            inset: -100%;
            background: conic-gradient(from 0deg, red, yellow, lime, aqua, blue, magenta, red);
            animation: rotateRGB var(--rgb-speed) linear infinite;
            z-index: -2;
        }

        html::after {
            content: '';
            position: fixed;
            inset: var(--border-width);
            background: #0b0b0b;
            z-index: -1;
        }

        @keyframes rotateRGB {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }

        #status-bar {
            background: #1a1a1a;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 1px solid #333;
            margin: var(--border-width) var(--border-width) 0 var(--border-width);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-right: 15px;
            border-right: 2px solid #00ff00;
        }

        .timer { font-size: 50px; color: #00ff00; font-weight: bold; min-width: 160px; text-align: center; }
        .stat { font-size: 18px; font-weight: bold; }

        .settings { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        input[type=range] { cursor: pointer; width: 120px; accent-color: #00ff00; }

        #main-layout {
            display: flex;
            flex-grow: 1;
            padding: 10px;
            gap: 10px;
            margin: 0 var(--border-width) var(--border-width) var(--border-width);
            min-height: 0;
            overflow: hidden;
        }

        #test-area {
            flex-grow: 1;
            background-image: url('https://c4.wallpaperflare.com/wallpaper/549/645/134/counter-strike-global-offensive-silhouette-jumping-wallpaper-thumb.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.9;
            border: 1px solid #222;
            display: flex;
            align-items: center; 
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 2px 2px 4px #000;
            position: relative;
            cursor: crosshair;
        }

        #history-log {
            width: 280px;
            background: #161616;
            border-left: 1px solid #333;
            padding: 15px;
            display: flex; 
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 100%;
        }

        #history-log::-webkit-scrollbar { width: 5px; }
        #history-log::-webkit-scrollbar-track { background: #111; }
        #history-log::-webkit-scrollbar-thumb { background: #00ff00; }

        .history-header {
            text-align: center;
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            background: #161616;
            padding-bottom: 10px;
            z-index: 10;
        }

        .history-item { background: #222; padding: 12px; border-left: 3px solid #00ff00; flex-shrink: 0; }
        .strafe-line { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid #333; }

        .key { padding: 10px 20px; border: 2px solid #444; border-radius: 5px; font-weight: bold; background: rgba(0,0,0,0.6); }
        .active { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }

        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        button { padding: 15px 40px; background: #00ff00; border: none; font-weight: bold; cursor: pointer; font-size: 18px; color: #000; }
    </style>
</head>
<body>

    <div id="status-bar">
        <div class="header-title">wAFF's Strafe Sync Analyzer</div>
        <div class="settings">
            <span>TIME: <span id="timeVal" style="color:#00ff00">1.0</span>s</span>
            <input type="range" id="timeSlider" min="0.1" max="5.0" step="0.1" value="1.0" oninput="updateTimeSetting()">
        </div>
        <div id="timer" class="timer">1.00s</div>
        <div style="display: flex; gap: 20px;">
            <div class="stat">SYNC: <span id="liveSync">0</span>%</div>
            <div class="stat">STF: <span id="liveStrafes">0</span></div>
        </div>
    </div>

    <div id="main-layout">
        <div id="test-area">
            PRESS A OR D TO START
            <div style="position:absolute; bottom:20px; display:flex; gap:20px;">
                <div id="keyA" class="key">A</div>
                <div id="keyD" class="key">D</div>
            </div>
        </div>
        <div id="history-log">
            <div class="history-header">SESSION HISTORY</div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <h1 style="color:#00ff00">FINISHED</h1>
        <button onclick="reset()">RETRY</button>
    </div>

    <script>
        let running = false, waiting = true, startTime, timerInt;
        let keys = {a: false, d: false}, lastX = 0, totalTicks = 0, syncTicks = 0;
        let strafesData = [], currentStrafeIdx = -1, lastDir = '';

        function updateTimeSetting() {
            let val = document.getElementById('timeSlider').value;
            document.getElementById('timeVal').innerText = parseFloat(val).toFixed(1);
            if(waiting) reset();
        }

        window.addEventListener('keydown', e => {
            let k = e.key.toLowerCase();
            if((k=='a' || k=='d') && !keys[k]) {
                keys[k] = true;
                document.getElementById('key'+k.toUpperCase()).classList.add('active');
                if(waiting) start();
            }
        });

        window.addEventListener('keyup', e => {
            let k = e.key.toLowerCase();
            if(k=='a' || k=='d') {
                keys[k] = false;
                document.getElementById('key'+k.toUpperCase()).classList.remove('active');
            }
        });

        document.getElementById('test-area').addEventListener('mousemove', e => {
            if(!running) return;
            let dir = e.screenX < lastX ? 'L' : (e.screenX > lastX ? 'R' : '');
            if(dir) {
                if(dir !== lastDir) {
                    currentStrafeIdx++;
                    strafesData[currentStrafeIdx] = { total: 0, sync: 0 };
                    lastDir = dir;
                }
                totalTicks++;
                strafesData[currentStrafeIdx].total++;
                if((dir=='L' && keys.a && !keys.d) || (dir=='R' && keys.d && !keys.a)) {
                    syncTicks++;
                    strafesData[currentStrafeIdx].sync++;
                }
                update();
            }
            lastX = e.screenX;
        });

        function start() {
            waiting = false; running = true;
            startTime = Date.now();
            let duration = parseFloat(document.getElementById('timeSlider').value) * 1000;
            timerInt = setInterval(() => {
                let rem = Math.max(0, duration - (Date.now() - startTime));
                document.getElementById('timer').innerText = (rem/1000).toFixed(2) + "s";
                if(rem <= 0) finish();
            }, 10);
        }

        function update() {
            document.getElementById('liveSync').innerText = totalTicks > 0 ? Math.round((syncTicks/totalTicks)*100) : 0;
            document.getElementById('liveStrafes').innerText = currentStrafeIdx + 1;
        }

        function finish() {
            running = false; clearInterval(timerInt);
            let log = document.getElementById('history-log');
            let item = document.createElement('div');
            item.className = 'history-item';
            let avgSync = totalTicks > 0 ? Math.round((syncTicks/totalTicks)*100) : 0;
            let html = `<strong>SYNC: ${avgSync}% (${document.getElementById('timeSlider').value}s)</strong><br>`;
            strafesData.forEach((data, i) => {
                let sSync = data.total > 0 ? Math.round((data.sync / data.total) * 100) : 0;
                let color = sSync > 80 ? '#00ff00' : (sSync > 50 ? '#ffff00' : '#ff4444');
                html += `<div class="strafe-line"><span>Stf #${i+1}</span><span style="color:${color}">${sSync}%</span></div>`;
            });
            item.innerHTML = html;
            log.insertBefore(item, log.children[1]);
            document.getElementById('overlay').style.display = 'flex';
        }

        function reset() {
            running = false; clearInterval(timerInt); waiting = true; 
            totalTicks = 0; syncTicks = 0; strafesData = []; currentStrafeIdx = -1; lastDir = '';
            let val = document.getElementById('timeSlider').value;
            document.getElementById('timer').innerText = parseFloat(val).toFixed(2) + "s";
            document.getElementById('overlay').style.display = 'none';
            update();
        }
    </script>
</body>
</html>
